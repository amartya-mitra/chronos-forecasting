# Chronos-2 Reasoning SFT: Full Capacity Config
# Optimized for A10G (24GB VRAM)

model_id: "amazon/chronos-t5-small"
training_data_path: "reasoning-finetuning/data/gifteval-reasoning-full.arrow"

# Training Hyperparameters
max_steps: 5000
learning_rate: 1e-4  # Slightly higher for larger data
per_device_train_batch_size: 16
gradient_accumulation_steps: 1
lr_scheduler_type: "cosine"
warmup_ratio: 0.05

# Evaluation and Saving
eval_steps: 500
save_steps: 1000
logging_steps: 100

# Tokenizer and Model lengths
context_length: 512
prediction_length: 64
n_tokens: 4096

# Reasoning specific
# (These are handled by the train_reasoning.py script logic)
max_new_tokens: 300
prediction_length_reasoning: 256

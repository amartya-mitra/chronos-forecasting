training_data_paths:
- "gifteval-data.arrow"
probability:
- 1.0
context_length: 512
prediction_length: 64
min_past: 60
max_steps: 1000
save_steps: 500
log_steps: 10
per_device_train_batch_size: 32
learning_rate: 0.0001
optim: adamw_torch_fused
num_samples: 20
shuffle_buffer_length: 10_000
gradient_accumulation_steps: 1
model_id: amazon/chronos-t5-small
model_type: seq2seq
random_init: false
tie_embeddings: true
output_dir: ./output/gifteval-finetune/
tf32: true
torch_compile: true
tokenizer_class: "MeanScaleUniformBins"
tokenizer_kwargs:
  low_limit: -15.0
  high_limit: 15.0
n_tokens: 4096
lr_scheduler_type: linear
warmup_ratio: 0.1
dataloader_num_workers: 0
max_missing_prop: 0.9
use_eos_token: true
